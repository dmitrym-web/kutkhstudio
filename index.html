<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Творческая мастерская Кутха</title>
    <meta name="description" content="Помогаем вашим идеям обрести форму. 3D-печать, моделирование, литье, лазерная гравировка.">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="Творческая мастерская Кутха">
    <meta property="og:description" content="Моделирование, 3D-печать, изготовление молдов, литьё из силикона, гипса и бетона и лазерная гравировка. Творим, как Кутх.">
    <meta property="og:image" content="https://kutkhstudio.ru/logo.jpeg">
    <meta name="theme-color" content="#0b0f1a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%236d5efc'/></svg>">
    <style>
        [hidden] { display: none !important; }
        :root{
            --accent:#6d5efc;
            --radius:18px;
        }
        html[data-theme="dark"]{
            --bg:#0b0f1a;
            --card:rgba(255,255,255,.045);
            --card-border:rgba(255,255,255,.09);
            --text:#f1f5f9;
            --muted:#94a3b8;
            --btn:rgba(255,255,255,.06);
            --btn-hover:rgba(255,255,255,.12);
            --shadow:0 24px 70px rgba(0,0,0,.55);
        }
        html[data-theme="light"]{
            --bg:#f4f5fa;
            --card:rgba(255,255,255,.72);
            --card-border:rgba(15,23,42,.08);
            --text:#0f172a;
            --muted:#64748b;
            --btn:#ffffff;
            --btn-hover:#f8fafc;
            --shadow:0 24px 60px rgba(15,23,42,.10);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{min-height:100%}
        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            min-height:100dvh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:28px 16px;
            position:relative;
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased;
            transition:background .35s ease,color .35s ease;
        }
        .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
        .blob{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.32}
        .b1{background:var(--accent);top:-22vmax;left:-16vmax;animation:f1 20s ease-in-out infinite}
        .b2{background:#f472b6;bottom:-26vmax;right:-20vmax;animation:f2 24s ease-in-out infinite}
        html[data-theme="light"] .blob{opacity:.20}
        @keyframes f1{50%{transform:translate(6vmax,4vmax) scale(1.12)}}
        @keyframes f2{50%{transform:translate(-5vmax,-4vmax) scale(1.16)}}
        .card{
            position:relative;
            width:100%;
            max-width:480px;
            background:var(--card);
            border:1px solid var(--card-border);
            border-radius:30px;
            padding:38px 24px 26px;
            box-shadow:var(--shadow);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            text-align:center;
            animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
            transition:background .35s ease,border-color .35s ease;
        }
        @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
        .theme-toggle{
            position:absolute;top:14px;right:14px;
            width:36px;height:36px;border-radius:50%;
            display:grid;place-items:center;
            background:var(--btn);border:1px solid var(--card-border);
            color:var(--muted);cursor:pointer;
            transition:background .2s,color .2s,transform .2s;
        }
        .theme-toggle:hover{background:var(--btn-hover);color:var(--text);transform:rotate(-15deg)}
        .theme-toggle svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
        html[data-theme="dark"] .i-moon,
        html[data-theme="light"] .i-sun{display:none}
        .avatar-wrap{width:104px;height:104px;margin:0 auto 16px;position:relative;border-radius:50%;overflow:hidden;}
        .avatar{
            width:100%;height:100%;border-radius:50%;object-fit:cover;
            border:3px solid var(--card-border);
            box-shadow:0 10px 30px rgba(0,0,0,.25);
            display:block;
        }
        .avatar-fallback{
            width:100%;height:100%;border-radius:50%;
            display:grid;place-items:center;
            background:var(--accent);color:#fff;
            font-size:36px;font-weight:700;letter-spacing:1px;
            border:3px solid var(--card-border);
        }
        .name{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25; margin-top: 12px;}
        .handle{font-size:14px;color:var(--muted);margin-top:3px;text-decoration:none;display:inline-block}
        .handle:hover{color:var(--accent)}
        .bio{
            font-size:14px;line-height:1.6;color:var(--muted);
            margin:14px auto 0;max-width:38ch;
            white-space:pre-line;
            text-align:left;
        }
        .links{display:grid;gap:10px;margin-top:28px;text-align:left}
        .link{
            display:flex;align-items:center;gap:14px;
            padding:10px 14px;
            border-radius:var(--radius);
            background:var(--btn);
            border:1px solid var(--card-border);
            color:inherit;text-decoration:none;
            transition:background .18s,transform .18s,border-color .18s;
            animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
            animation-delay:calc(var(--i) * 55ms + 120ms);
        }
        .link:hover{background:var(--btn-hover);transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
        .link:active{transform:translateY(0) scale(.99)}
        .badge{
            flex:0 0 40px;height:40px;border-radius:13px;
            display:grid;place-items:center;
            background:var(--bc,var(--accent));
            color:#fff;
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
            user-select:none;
        }
        .badge svg, .badge img{width:20px;height:20px;display:block;object-fit: contain;}
        .badge svg{fill:currentColor;}
        .link-body{flex:1;min-width:0}
        .link-label{font-size:14.5px;font-weight:600;line-height:1.3}
        .link-sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .arrow{
            flex:0 0 auto;width:16px;height:16px;color:var(--muted);
            opacity:0;transform:translateX(-6px);
            transition:opacity .2s,transform .2s;
        }
        .link:hover .arrow{opacity:.75;transform:translateX(0)}
        .arrow svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .footer{
            margin-top:26px;font-size:12px;color:var(--muted);opacity:.75;
            animation:rise .5s ease both;animation-delay:.6s;
        }
        @media (max-width:420px){
            .card{padding:32px 18px 22px;border-radius:26px}
            .avatar-wrap{width:88px;height:88px}
            .name{font-size:20px}
            .link{padding:9px 12px;gap:12px}
            .badge{flex-basis:36px;height:36px;border-radius:11px}
            .badge svg, .badge img{width:18px;height:18px;}
        }
        @media (prefers-reduced-motion:reduce){
            *,*::before,*::after{animation:none!important;transition:none!important}
        }
    </style>
</head>
<body>
<div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
</div>
<main class="card">
    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
    <div class="avatar-wrap">
        <img class="avatar" id="avatar" alt="" hidden>
        <div class="avatar-fallback" id="avatarFallback" hidden></div>
    </div>
    <h1 class="name" id="name"></h1>
    <div id="handleContainer"></div>
    <p class="bio" id="bio"></p>
    <nav class="links" id="links" aria-label="Мои ссылки"></nav>
    <p class="footer" id="footer"></p>
</main>
<script>
    const CONFIG = {
        avatar: "logo.jpeg",
        name: "Творческая мастерская Кутха",
        handle: "@kutkh23",
        handleUrl: "https://t.me/kutkh23",
        bio: "Добро пожаловать в Творческую мастерскую Кутха.\nПомогаем вашим идеям обрести форму.\n\nЧем мы занимаемся:\n— Моделирование\n— 3D-печать\n— Изготовление молдов\n— Литьё из силикона, гипса и бетона\n— Лазерная гравировка\n\nРаботаем с частными заказами, творческими мастерскими и малым бизнесом.\n\nТворим, как Кутх.",
        accent: "#6d5efc",
        theme: "auto",
        footer: "© 2026 Kutkh Studio",
        links: [
            { label:"Сайт мастерской", url:"https://kutkhstudio.ru/", icon:"site", color:"#10b981" },
            { label:"Telegram", url:"https://t.me/kutkh_studo", icon:"telegram", color:"#26A5E4" },
            { label:"Threads", url:"https://www.threads.com/@kutkh_studio", icon:"threads", color:"#000000" },
            { label:"Instagram", url:"https://www.instagram.com/kutkh_studio", icon:"instagram", color:"#E1306C" },
            { label:"ВКонтакте", url:"https://vk.ru/kutkh_studio", icon:"vk", color:"#0077FF" },
            { label:"Авито", url:"#", icon:"avito", color:"#005BFF" },
            { label:"Boosty", url:"#", icon:"boosty", color:"#F1592A" },
        ]
    };

    const ICONS = {
        site: '<path d="M20 4H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 12H4V6h16v10zm-8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>',
        telegram: '<path d="M21.5 2.5L2.5 9.8c-1.3.5-1.3 1.5 0 2l4.8 1.5 1.9 5.7c.2.7.9.8 1.4.3l2.6-2.5 5.2 3.8c1 .6 1.7.3 2-.9l3.7-17.3c.3-1.3-.5-2-1.6-1.5zM17.6 6.1l-7.8 7-.4 4.1-1.8-5.4 10-5.7z"/>',
        threads: '<img src="https://cdn.simpleicons.org/threads/ffffff" alt="Threads">',
        instagram: '<path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.9.2 2.3.4.6.2 1 .5 1.5 1 .5.5.8.9 1 1.5.2.4.3 1.1.4 2.3.1 1.2.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.9-.4 2.3-.2.6-.5 1-1 1.5-.5.5-.9.8-1.5 1-.4.2-1.1.3-2.3.4-1.2.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.9-.2-2.3-.4-.6-.2-1-.5-1.5-1-.5-.5-.8-.9-1-1.5-.2-.4-.3-1.1-.4-2.3-.1-1.2-.1-1.6-.1-4.8s0-3.6.1-4.8c.1-1.2.2-1.9.4-2.3.2-.6.5-1 1-1.5.5-.5.9-.8 1.5-1 .4-.2 1.1-.3 2.3-.4 1.2-.1 1.6-.1 4.8-.1zM12 0C8.7 0 8.3 0 7.1.1 5.8.2 4.9.4 4.1.7c-.8.3-1.5.7-2.1 1.4-.7.7-1.1 1.3-1.4 2.1-.3.8-.5 1.7-.6 3C0 8.3 0 8.7 0 12s0 3.7.1 4.9c.1 1.3.3 2.2.6 3 .3.8.7 1.5 1.4 2.1.7.7 1.3 1.1 2.1 1.4.8.3 1.7.5 3 .6 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c1.3-.1 2.2-.3 3-.6.8-.3 1.5-.7 2.1-1.4.7-.7 1.1-1.3 1.4-2.1.3-.8.5-1.7.6-3 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.1-1.3-.3-2.2-.6-3-.3-.8-.7-1.5-1.4-2.1-.7-.7-1.3-1.1-2.1-1.4-.8-.3-1.7-.5-3-.6C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-10.8a1.4 1.4 0 1 1-2.8 0 1.4 1.4 0 0 1 2.8 0z"/>',
        vk: '<path d="M22.3 7.2c.2-.5 0-1-.6-1h-3.2c-.5 0-.8.2-1 .6 0 0-1.2 2.8-2.9 4.6-.5.5-.8.7-1.1.7-.2 0-.4-.2-.4-.8V7.2c0-.6-.2-.9-.9-.9H9.4c-.4 0-.7.2-.7.5 0 .6.9.7 1 2.3v3.4c0 .8-.1 1-.4 1-.8 0-2.7-2.8-3.8-6-.2-.6-.5-.9-1.1-.9H1.2c-.7 0-.9.2-.9.6 0 .7.9 4 3.9 8.3 2 2.9 4.9 4.4 7.5 4.4 1.6 0 1.8-.3 1.8-1v-2.4c0-.6.2-.8.6-.8.4 0 1 .2 2.4 1.7 1.7 1.7 2 2.5 2.9 2.5h3.2c.6 0 .9-.3.7-1-.2-.7-1.3-2.2-2.6-3.8-.7-.9-.6-1.3 0-2.1 0 0 2.2-3.1 2.4-3.8z"/>',
        avito: '<path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm4 12l-1-2h-6l-1 2H6l5-10h2l5 10h-2zM11 12h2l-1-2.5-1 2.5z"/>',
        boosty: '<path d="M2.661 14.337 6.801 0h6.362L11.88 4.444l-.038.077-3.378 11.733h3.15c-1.321 3.289-2.35 5.867-3.086 7.733-5.816-.063-7.442-4.228-6.02-9.155M8.554 24l7.67-11.035h-3.25l2.83-7.073c4.852.508 7.137 4.33 5.791 8.952C20.16 19.81 14.344 24 8.68 24h-.127z"/>'
    };

    const $ = (id) => document.getElementById(id);
    const root = document.documentElement;
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedTheme = localStorage.getItem('theme');
    root.dataset.theme = savedTheme || (CONFIG.theme === 'auto' ? (sysDark ? 'dark' : 'light') : CONFIG.theme);

    $('themeToggle').addEventListener('click', () => {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('theme', next);
        document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', next === 'dark' ? '#0b0f1a' : '#f4f5fa');
    });

    if (CONFIG.accent) root.style.setProperty('--accent', CONFIG.accent);
    $('name').textContent = CONFIG.name || '';
    $('bio').textContent = CONFIG.bio || '';
    $('footer').textContent = CONFIG.footer || '';
    $('bio').hidden = !CONFIG.bio;
    $('footer').hidden = !CONFIG.footer;

    if (CONFIG.handle) {
        const h = document.createElement(CONFIG.handleUrl ? 'a' : 'span');
        h.className = 'handle';
        h.textContent = CONFIG.handle;
        if (CONFIG.handleUrl) {
            h.href = CONFIG.handleUrl;
            h.target = '_blank';
            h.rel = 'noopener noreferrer';
        }
        $('handleContainer').appendChild(h);
    }

    const initials = (CONFIG.name || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');

    if (CONFIG.avatar) {
        const img = $('avatar');
        img.src = CONFIG.avatar;
        img.alt = CONFIG.name || 'Аватар';
        img.hidden = false;
        img.addEventListener('error', () => {
            img.remove();
            const fb = $('avatarFallback');
            fb.textContent = initials;
            fb.hidden = false;
        });
    } else {
        $('avatar').remove();
        const fb = $('avatarFallback');
        fb.textContent = initials;
        fb.hidden = false;
    }

    const linksEl = $('links');
    CONFIG.links.forEach((item, i) => {
        const a = document.createElement('a');
        a.className = 'link';
        a.href = item.url;
        a.style.setProperty('--i', i);

        const isExternal = /^https?:\/\//i.test(item.url);
        if (isExternal) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
        }

        let badgeInner = '';
        if (item.icon && ICONS[item.icon]) {
            const iconCode = ICONS[item.icon];
            if (iconCode.startsWith('<img')) {
                badgeInner = iconCode;
            } else {
                badgeInner = `<svg viewBox="0 0 24 24">${iconCode}</svg>`;
            }
        } else {
            badgeInner = item.letter || item.label.slice(0, 2).toUpperCase();
        }

        a.innerHTML = `
    <span class="badge" style="--bc:${item.color || 'var(--accent)'}">${badgeInner}</span>
    <span class="link-body">
      <span class="link-label">${item.label}</span>
      ${item.sub ? `<span class="link-sub">${item.sub}</span>` : ''}
    </span>
    <span class="arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
    </span>
  `;
        linksEl.appendChild(a);
    });
</script>
</body>
</html>
